<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="TwitchMiner icon">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#2e1065"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="0.55" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e5e7eb"/>
      <stop offset="1" stop-color="#9ca3af"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- pickaxe: handle -->
  <g transform="rotate(-38 256 256)">
    <rect x="236" y="70" width="40" height="400" rx="18" fill="#a16207"/>
    <rect x="236" y="70" width="14" height="400" rx="7" fill="#ca8a04" opacity="0.7"/>
    <!-- pickaxe: head -->
    <path d="M70 150 Q256 40 442 150 L424 186 Q256 112 88 186 Z" fill="url(#steel)" stroke="#6b7280" stroke-width="6" stroke-linejoin="round"/>
  </g>
  <!-- coin -->
  <circle cx="262" cy="308" r="112" fill="#1e1b4b" opacity="0.35"/>
  <circle cx="256" cy="300" r="106" fill="url(#gold)" stroke="#b45309" stroke-width="8"/>
  <circle cx="256" cy="300" r="80" fill="none" stroke="#b45309" stroke-width="6" opacity="0.7"/>
  <!-- plus mark (points gained) -->
  <path d="M256 252 v96 M208 300 h96" stroke="#78350f" stroke-width="22" stroke-linecap="round"/>
  <!-- sparkle -->
  <path d="M410 96 l9 26 26 9 -26 9 -9 26 -9 -26 -26 -9 26 -9 z" fill="#fef3c7"/>
</svg>
